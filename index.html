<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chat</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css/github-markdown-light.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { touch-action: pan-x pan-y; }
  body { font-family: sans-serif; background: #fff; color: #222; height: 100vh; display: flex; flex-direction: column; }
  #setup { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; gap: 10px; }
  input, button { padding: 8px 14px; font-size: 16px; border-radius: 4px; border: 1px solid #ccc; background: #fff; color: #222; }
  button { cursor: pointer; background: #eef; border: 1px solid #aac; }
  #chat { display: none; flex-direction: column; height: 100vh; }
  #messages { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 4px; }
  .msg { padding: 8px 12px; border-radius: 5px; font-size: 14px; width: fit-content; }
  .msg.markdown-body { background: transparent; font-size: 14px; padding: 8px 12px; }
  .msg.markdown-body > *:first-child { margin-top: 0; }
  .msg.markdown-body > *:last-child { margin-bottom: 0; }
  .msg-wrap { max-width: 75%; display: flex; flex-direction: column; margin-top: 2px; }
  .msg-wrap:has(.msg-name:not([style*="display: none"])) { margin-top: 10px; }
  .msg-wrap.me { align-self: flex-end; align-items: flex-end; }
  .msg-wrap.them { align-self: flex-start; align-items: flex-start; }
  .msg-name { font-size: 11px; margin-bottom: 1px; padding-left: 4px; color: #777; }
  #topbar { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-bottom: 1px solid #eee; font-size: 12px; color: #999; }
  #status { cursor: default; position: relative; }
  #status-popup { display: none; position: absolute; top: 100%; left: 0; background: #fff; border: 1px solid #ddd; border-radius: 4px; padding: 6px 10px; font-size: 13px; color: #222; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,0.1); z-index: 10; }
  #status:hover #status-popup { display: block; }
  #room-label { font-size: 18px; font-weight: bold; color: #222; }
  #logout { font-size: 12px; background: none; border: none; color: #999; cursor: pointer; }
  #bar { display: flex; gap: 6px; padding: 8px; background: #f8f8f8; border-top: 1px solid #ddd; align-items: flex-end; }
  #bar textarea { flex: 1; resize: none; font-family: sans-serif; padding: 8px 14px; font-size: 16px; border-radius: 4px; border: 1px solid #ccc; max-height: 120px; overflow-y: auto; }
  #file-btn { font-size: 22px; cursor: pointer; padding: 4px; user-select: none; }
  .file-msg { display: flex; flex-direction: column; gap: 4px; }
  .file-msg img { max-width: 240px; max-height: 200px; border-radius: 4px; cursor: pointer; }
  .file-msg a { color: #36c; font-size: 13px; word-break: break-all; }
  .file-size { font-size: 11px; color: #999; }
</style>
</head>
<body>

<div id="setup">
  <input id="name" placeholder="Name" style="text-align:center;width:200px" />
  <input id="room" placeholder="Room" style="text-align:center;width:200px" />
  <button id="go">Join</button>
</div>

<div id="chat">
  <div id="topbar">
    <span id="status"><span id="status-text">Connecting...</span><div id="status-popup"></div></span>
    <span id="room-label"></span>
    <button id="logout" onclick="localStorage.removeItem('chat_name');location.reload()">logout</button>
  </div>
  <div id="messages"></div>
  <div id="bar">
    <label id="file-btn" title="Send file">&#128206;<input type="file" id="file-input" style="display:none" /></label>
    <textarea id="msg" placeholder="Message... (Shift+Enter for new line)" rows="1"></textarea>
    <button id="send">Send</button>
  </div>
</div>

<script>document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });</script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<script type="module">
import { joinRoom } from 'https://esm.sh/@trystero-p2p/mqtt';

const renderer = new marked.Renderer();
renderer.link = function({ href, text }) { return '<a href="' + href + '" target="_blank" rel="noopener">' + text + '</a>'; };
marked.setOptions({ renderer });

const urlRoom = new URLSearchParams(location.search).get('room');
if (urlRoom) document.getElementById('room').value = urlRoom;
const savedName = localStorage.getItem('chat_name');
if (savedName) document.getElementById('name').value = savedName;

let sendMsg, files, myName, currentRoom = '', lastSender = '';

function nameHue(name) {
  let h = 2166136261;
  for (let i = 0; i < name.length; i++) { h ^= name.charCodeAt(i); h = Math.imul(h, 16777619); }
  return ((h >>> 0) % 360);
}
function nameColor(name) { return 'hsl(' + nameHue(name) + ', 70%, 40%)'; }
function bubbleColor(name) { return 'hsl(' + nameHue(name) + ', 80%, 90%)'; }

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function ping() {
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.frequency.value = 800;
  g.gain.value = 0.15;
  o.start(); o.stop(audioCtx.currentTime + 0.1);
}

function join() {
  myName = document.getElementById('name').value.trim();
  const r = document.getElementById('room').value.trim();
  if (!myName || !r) return;
  localStorage.setItem('chat_name', myName);
  history.replaceState(null, '', '?room=' + encodeURIComponent(r));

  const room = joinRoom({ appId: 'onetimechat-phan' }, r);
  const chat = room.makeAction('chat');
  const sync = room.makeAction('sync');
  const names = room.makeAction('name');
  files = room.makeAction('file');
  sendMsg = chat.send;

  currentRoom = r;
  document.getElementById('setup').style.display = 'none';
  document.getElementById('chat').style.display = 'flex';
  document.getElementById('room-label').textContent = r;
  loadHistory(r);

  const peers = {};
  const updateStatus = () => {
    const now = Date.now();
    Object.keys(peers).forEach(id => { if (now - peers[id].t > 8000) delete peers[id]; });
    const names = [myName, ...Object.values(peers).map(p => p.n)];
    document.getElementById('status-text').textContent = names.length + ' online';
    document.getElementById('status-popup').innerHTML = names.map(n => '<div style="color:' + nameColor(n) + '">' + n + '</div>').join('');
  };
  updateStatus();
  room.onPeerJoin((id) => {
    names.send(myName, id);
    const h = JSON.parse(localStorage.getItem('chat_' + currentRoom) || '[]');
    if (h.length) sync.send(h, id);
  });
  room.onPeerLeave((id) => { delete peers[id]; updateStatus(); });
  names.onMessage((name, id) => { peers[id] = { n: name, t: Date.now() }; updateStatus(); });
  setInterval(() => names.send(myName), 5000);
  setInterval(updateStatus, 5000);
  chat.onMessage((d) => { addMsg(d.n, d.t, d.ts || Date.now()); ping(); });
  files.onReceive(({ byteLength, metadata, userId }) => {
    addFileProgress(peers[userId]?.n || 'unknown', metadata.name, metadata.id);
    return true;
  });
  files.onReceiveProgress((progress, { userId, metadata }) => {
    updateFileProgress(metadata.id, progress);
  });
  files.onMessage((bytes, { userId, metadata }) => {
    const sender = peers[userId]?.n || 'unknown';
    const blob = new Blob([bytes], { type: metadata.type });
    completeFileProgress(metadata.id, sender, metadata.name, metadata.type, blob);
    saveFilePlaceholder(sender, metadata.name, blob.size, Date.now());
    ping();
  });
  sync.onMessage((remote) => mergeHistory(remote));
}

document.getElementById('go').onclick = join;
document.getElementById('send').onclick = go;
document.getElementById('file-input').onchange = async (e) => {
  const file = e.target.files[0];
  if (!file || !files) return;
  const MAX = 50 * 1024 * 1024;
  if (file.size > MAX) { alert('File too large (max 50MB)'); return; }
  const id = Date.now() + '-' + Math.random().toString(36).slice(2);
  addFileMsg(myName, file.name, file.type, file, Date.now());
  saveFilePlaceholder(myName, file.name, file.size, Date.now());
  await files.send(file, {
    metadata: { id, name: file.name, type: file.type }
  });
  e.target.value = '';
};
const msgEl = document.getElementById('msg');
msgEl.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); go(); } };
msgEl.oninput = () => { msgEl.style.height = 'auto'; msgEl.style.height = msgEl.scrollHeight + 'px'; };

document.addEventListener('paste', async (e) => {
  const items = e.clipboardData?.items;
  if (!items || !files) return;
  for (const item of items) {
    if (!item.type.startsWith('image/')) continue;
    e.preventDefault();
    const file = item.getAsFile();
    const name = 'clipboard-' + Date.now() + '.' + file.type.split('/')[1];
    const id = Date.now() + '-' + Math.random().toString(36).slice(2);
    addFileMsg(myName, name, file.type, file, Date.now());
    saveFilePlaceholder(myName, name, file.size, Date.now());
    await files.send(file, {
      metadata: { id, name, type: file.type }
    });
    break;
  }
});

if (savedName && urlRoom) join();

function go() {
  const el = document.getElementById('msg');
  const t = el.value.trim();
  if (!t || !sendMsg) return;
  const ts = Date.now();
  sendMsg({ n: myName, t, ts });
  addMsg(myName, t, ts);
  el.value = '';
  el.style.height = 'auto';
}

function addMsg(name, text, ts = Date.now(), save = true) {
  const cls = name === myName ? 'me' : 'them';
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap ' + cls;
  const showName = cls !== 'me' && name !== lastSender;
  lastSender = name;
  const label = document.createElement('div');
  label.className = 'msg-name';
  label.textContent = name;
  if (!showName) label.style.display = 'none';
  const d = document.createElement('div');
  d.className = 'msg markdown-body';
  d.style.background = bubbleColor(name);
  d.innerHTML = DOMPurify.sanitize(marked.parse(text), { ADD_ATTR: ['target'] });
  if (text.startsWith('[File: ')) d.style.fontStyle = 'italic';
  d.title = new Date(ts).toLocaleString();
  wrap.appendChild(label);
  wrap.appendChild(d);
  const m = document.getElementById('messages');
  m.appendChild(wrap);
  m.scrollTop = m.scrollHeight;
  if (save) {
    const key = 'chat_' + currentRoom;
    const h = JSON.parse(localStorage.getItem(key) || '[]');
    h.push({ name, text, ts });
    localStorage.setItem(key, JSON.stringify(h));
  }
}

function addFileMsg(sender, fileName, fileType, blob, ts = Date.now()) {
  const cls = sender === myName ? 'me' : 'them';
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap ' + cls;
  const showName = cls !== 'me' && sender !== lastSender;
  lastSender = sender;
  const label = document.createElement('div');
  label.className = 'msg-name';
  label.textContent = sender;
  if (!showName) label.style.display = 'none';
  const d = document.createElement('div');
  d.className = 'msg';
  d.style.background = bubbleColor(sender);
  d.title = new Date(ts).toLocaleString();
  const url = URL.createObjectURL(blob);
  const container = document.createElement('div');
  container.className = 'file-msg';
  if (fileType.startsWith('image/')) {
    const img = document.createElement('img');
    img.src = url;
    img.onclick = () => window.open(url, '_blank');
    container.appendChild(img);
  }
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  a.target = '_blank';
  a.textContent = fileName;
  container.appendChild(a);
  const size = document.createElement('span');
  size.className = 'file-size';
  const kb = blob.size / 1024;
  size.textContent = kb > 1024 ? (kb / 1024).toFixed(1) + ' MB' : Math.round(kb) + ' KB';
  container.appendChild(size);
  d.appendChild(container);
  wrap.appendChild(label);
  wrap.appendChild(d);
  const m = document.getElementById('messages');
  m.appendChild(wrap);
  m.scrollTop = m.scrollHeight;
}

function addFileProgress(sender, fileName, id) {
  const cls = sender === myName ? 'me' : 'them';
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap ' + cls;
  wrap.id = 'fp-' + id;
  const showName = cls !== 'me' && sender !== lastSender;
  lastSender = sender;
  const label = document.createElement('div');
  label.className = 'msg-name';
  label.textContent = sender;
  if (!showName) label.style.display = 'none';
  const d = document.createElement('div');
  d.className = 'msg';
  d.style.background = bubbleColor(sender);
  d.innerHTML = '<div class="file-msg"><span class="file-status" style="font-size:13px">Receiving ' + DOMPurify.sanitize(fileName) + '...</span></div>';
  wrap.appendChild(label);
  wrap.appendChild(d);
  const m = document.getElementById('messages');
  m.appendChild(wrap);
  m.scrollTop = m.scrollHeight;
}

function updateFileProgress(id, pct) {
  const el = document.getElementById('fp-' + id);
  if (!el) return;
  const p = Math.round(pct * 100);
  const status = el.querySelector('.file-status');
  if (status) status.textContent = status.textContent.replace(/\.\.\..*/, '... ' + p + '%');
  document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
}

function completeFileProgress(id, sender, fileName, fileType, blob) {
  const el = document.getElementById('fp-' + id);
  if (el) el.remove();
  addFileMsg(sender, fileName, fileType, blob, id);
}

function saveFilePlaceholder(name, fileName, sizeBytes, ts) {
  const key = 'chat_' + currentRoom;
  const h = JSON.parse(localStorage.getItem(key) || '[]');
  const kb = sizeBytes / 1024;
  const sizeStr = kb > 1024 ? (kb / 1024).toFixed(1) + ' MB' : Math.round(kb) + ' KB';
  h.push({ name, text: '[File: ' + fileName + ' (' + sizeStr + ')]', ts });
  localStorage.setItem(key, JSON.stringify(h));
}

function loadHistory(room) {
  currentRoom = room;
  const h = JSON.parse(localStorage.getItem('chat_' + room) || '[]');
  h.forEach(m => addMsg(m.name, m.text, m.ts, false));
}

function mergeHistory(remote) {
  const key = 'chat_' + currentRoom;
  const local = JSON.parse(localStorage.getItem(key) || '[]');
  const localSet = new Set(local.map(m => m.ts + '|' + m.name + '|' + m.text));
  const newMsgs = remote.filter(m => !localSet.has(m.ts + '|' + m.name + '|' + m.text));
  if (!newMsgs.length) return;
  const merged = [...local, ...newMsgs].sort((a, b) => a.ts - b.ts);
  localStorage.setItem(key, JSON.stringify(merged));
  document.getElementById('messages').innerHTML = '';
  merged.forEach(m => addMsg(m.name, m.text, m.ts, false));
}
</script>
</body>
</html>
